# This workflow will build a .NET project

name: Build
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'      
    - name: Log in to NuGet using trusted publishing
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: rwjdk
    - name: Publish to NuGet if needed
      run: |
        shopt -s globstar
        for package in src/**/bin/Release/*.nupkg; do
          dotnet nuget push "$package" --source 'https://api.nuget.org/v3/index.json' --api-key "$NUGET_API_KEY" --skip-duplicate
        done
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
